url: https://joonho112.github.io/regdatasets/

llm-docs: false

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#2C3E50"
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    code_font: {google: "Fira Code"}

home:
  title: "regdatasets: Datasets for Teaching Regression Analysis"
  description: >
    Twenty-two reproducibly built, cleaned, and documented datasets for
    teaching introductory and intermediate regression analysis in education
    and the social sciences.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Home
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Guides
      menu:
        - text: Getting Started
          href: articles/getting-started.html
        - text: Dataset Overview
          href: articles/dataset-overview.html
        - text: How the Data Are Built
          href: articles/data-provenance.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/joonho112/regdatasets
      aria-label: GitHub

articles:
  - title: "Guides"
    navbar: ~
    contents:
      - getting-started
      - dataset-overview
      - articles/data-provenance

reference:
  - title: "Functions & Package"
    desc: >
      Explore the registry, browse variable codebooks, and view package
      documentation.
    contents:
      - list_datasets
      - codebook
      - regdatasets-package

  - title: "Simple Regression"
    desc: >
      Datasets for introductory simple linear regression and comparing two
      groups with a dummy predictor (`simple-regression`).
    contents:
      - classdata_07
      - gcse
      - instruction
      - pisa2000

  - title: "ANCOVA"
    desc: >
      Datasets for comparing groups while controlling for a continuous
      covariate or pretest score (`ancova`).
    contents:
      - gcse
      - reading

  - title: "ANOVA & Categorical Predictors"
    desc: >
      Datasets for categorical predictors, dummy or effect coding, and
      one-way or two-way ANOVA as regression (`anova`).
    contents:
      - individuals
      - instruction
      - pisa2000
      - reading

  - title: "Continuous Predictors & Confounding"
    desc: >
      Datasets for multiple regression with continuous predictors, partial
      relationships, and confounding (`continuous-predictors`).
    contents:
      - crime
      - faculty

  - title: "Interactions"
    desc: >
      Datasets for dummy-by-dummy, dummy-by-continuous, and
      continuous-by-continuous interaction models (`interactions`).
    contents:
      - faculty
      - gcse
      - hsb_sub
      - individuals
      - pisa2000

  - title: "Nonlinear Relationships"
    desc: >
      Datasets for polynomial terms, log transformations, and nonlinear
      patterns (`nonlinear`).
    contents:
      - crime
      - gcse

  - title: "Model Building"
    desc: >
      Datasets for variable selection, nested model comparisons, and
      working with wide survey data (`model-building`).
    contents:
      - gcse
      - hsb_sub
      - hsbs1
      - nels_data

  - title: "Diagnostics"
    desc: >
      Datasets for residual plots, leverage, influence measures,
      collinearity, and goodness-of-fit checks (`diagnostics`).
    contents:
      - gcse
      - hsb_sub
      - hsbs1
      - nels_data
      - penalty

  - title: "Logistic Regression"
    desc: >
      Datasets for binary outcomes, odds ratios, Simpson's paradox, and
      maximum likelihood estimation (`logistic`).
    contents:
      - berk_sub
      - berkeley
      - disc
      - disc2
      - gss_1
      - penalty
      - pisa2000
      - titanic
      - womenlf

  - title: "Latent Response & GLM"
    desc: >
      Datasets for probit versus logit links and the latent-variable
      formulation of generalized linear models (`glm-latent`).
    contents:
      - grades
      - titanic

  - title: "Ordinal Response Models"
    desc: >
      Datasets for ordered categorical outcomes, proportional odds models,
      and threshold interpretations (`ordinal`).
    contents:
      - disc
      - disc2
      - grades
      - satisfaction
      - womenlf

  - title: "Multilevel & Longitudinal"
    desc: >
      Datasets with students nested in classrooms or schools, or repeated
      measurements over time (`multilevel-longitudinal`).
    contents:
      - alcohol1_pp
      - gcse
      - hsb_sub
      - instruction

footer:
  structure:
    left: developed_by
    right: built_with
